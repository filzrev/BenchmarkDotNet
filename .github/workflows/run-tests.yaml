name: run-tests
run-name: Run tests / ${{ github.event.head_commit.message }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
  workflow_dispatch:

env:
  IS_DRAFT_PR: ${{ github.event.pull_request.draft }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: test-macos (${{ matrix.os.arch }})
    runs-on: ${{ matrix.os.runs-on }}
    strategy:
      matrix:
        os:
          - runs-on: 'macos-latest'
            arch: 'arm64'
          - runs-on: 'macos-26-intel'
            arch: 'x64'
    steps:
      - uses: actions/checkout@v7
      
      - run: |
          vm_stat
          sysctl -n hw.memsize
          top -l 1 -s 0 | head -n 15
      
      # Setup additional tools
      - name: Setup additional tools for Wasm/NativeAot tests
        if: ${{ github.event.pull_request.draft != true }}
        uses: ./.github/actions/setup-additional-tools
        
      - run: dotnet build-server shutdown
      - name: Inspect memory information
        run: |
          system_profiler SPMemoryDataType
          system_profiler SPMemoryDataType -json
      - name: Save memory information
        run: |
          system_profiler SPMemoryDataType -json > memory.json
      - name: Upload memory information
        uses: actions/upload-artifact@v4
        with:
          name: macos-memory-info
          path: memory.json
      # Upload Artifacts with Unique Name
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-macos(${{ matrix.os.arch }})-trx-${{ github.run_id }}
          path: "**/memory.json"
