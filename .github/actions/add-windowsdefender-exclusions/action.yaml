name: Add Windows Defender Exclusions
description: |
  Add Windows Defender exclusions for the following directories.
  - $env:GITHUB_WORKSPACE
  - $env:TEMP
runs:
  using: "composite"
  steps:
    - name: Add Windows Defender Exclusions
      shell: pwsh
      run: |
        $maxRetries = 5

        for ($i = 1; $i -le $maxRetries; $i++) {
          try {
            $service = Get-Service WinDefend
            $service.WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
            Write-Host "Status: $($service.Status)"
            if($serviceStatus -eq 'Running') {
              Get-MpComputerStatus | Format-List * | Out-String -Stream | where { $_ -notmatch ':\s*$' } | Write-Host
              Get-MpPreference     | Format-List * | Out-String -Stream | where { $_ -notmatch ':\s*$' } | Write-Host
            }

            Add-MpPreference -ExclusionPath  $env:GITHUB_WORKSPACE
            Add-MpPreference -ExclusionPath  $env:TEMP
            break
          }
          catch {
            if ($i -ge $maxRetries) {
              throw
            }

            # Write warning by using Workflow command syntax
            Write-Host "::warning::Failed to configure Windows Defender exclusions (attempt $i/$maxRetries). Retrying..."
            Start-Sleep -Seconds 1
          }
        }
